# VSBC tensile tester: app settings.
# Copy this file to config.toml (in this folder) or to ~/.config/vsbc/config.toml.
# Everything is optional; the values below are the defaults.
# Machine calibration (steps/mm, load scale, travel limits, overload cutoff) is
# stored on the Mega, not here: change it from the Calibrate tab.

# Folder for test data, calibration records and logs (relative to this file).
output_dir = "Outputs"

# The Mega stops a move if the app has sent nothing for this long (ms).
watchdog_ms = 3000

[serial]
# port = "/dev/ttyACM0"      # or "COM5"; leave it out to auto-detect the Mega
baud = 115200
ready_timeout_s = 4.0        # the Mega resets when the port opens
log_data_lines = false       # also write every data line to the serial session log

[loadcell]
# Where the HX711 load-cell amplifier is wired:
#   "pi"   = to the Raspberry Pi's GPIO pins (dout_pin / sck_pin below)
#   "mega" = to the Arduino Mega (D26 / D27)
source = "mega"
dout_pin = 5                 # Pi GPIO number (BCM) on the HX711 DAT pin: GPIO5 = header pin 29
sck_pin = 6                  # Pi GPIO number (BCM) on the HX711 CLK pin: GPIO6 = header pin 31
gain = 128                   # HX711 gain: 128 or 64 (channel A), 32 (channel B)
rate_hz = 10                 # HX711 readings per second: 10 as shipped, 80 with its RATE jumper cut
                             # (docs/hardware.md). The camera saves one frame per reading. A warning
                             # shows when the measured rate does not match.
capacity_n = 500.0           # rated capacity of the load cell, N (sets the default overload cutoff)
gravity = 9.80665            # m/s^2, converts calibration masses to newtons

[test]                        # defaults for new tests
rate_mm_min = 5.0
max_extension_mm = 50.0
stop_load_n = 0.0            # 0 = off
break_drop_pct = 40.0        # 0 = no break detection
break_min_n = 5.0
tare_before = true
return_after = false
jog_rate_mm_s = 2.0

[gui]
fullscreen = false
refresh_hz = 25
time_window_s = 60
font_pt = 11                 # text size on a 1280 x 800 screen; other screens scale it (13 px at least)
scale = 0                    # 0 = from the screen size; else a fixed factor on font_pt (1.2 = 13.2 pt on any screen)

[units]                       # what the GUI shows; the Units tab changes it (and remembers the choice)
force = "N"                  # "N" or "lbf"
length = "mm"                # "mm", "cm", "m" or "in". data.csv always keeps N and mm columns too.

[storage]                     # warning banner when the drive with output_dir runs low
warn_free_gb = 10.0
critical_free_gb = 2.0

[camera]                      # the DIC camera. Exposure, crop, buffer and DIC settings are the
                              # USER SETTINGS in camera/capture_dic_live.py.
enabled = true               # show the Camera tab
auto_start = true            # start the camera preview when the app opens
dir = "camera"               # folder with the camera scripts (swap updated scripts in here)
python = ""                  # camera environment's Python; "" = .venv-camera next to the app, else this app's
simulate = false             # synthetic camera instead of the Basler (vsbc gui --sim does this too)
record_with_test = true
save_mode = "match"          # "match": the frame nearest each load sample (1:1 with data.csv)
                             # "every": every SAVE_EVERY-th frame; "all": every frame
match_divisor = 1            # "match": one frame every this many load samples (1 = every sample)
dump_on_break = true         # keep every frame of the RAM buffer when the Mega detects the break
load_delay_ms = 0.0          # HX711 filter lag (measure with a tap test), used when pairing frames
live_dic = false             # DIC during the test (slow on the Pi, can cost frames)
run_dic = true               # after the test:
run_strain = true            #   strain + plots (pyvale_dic_run.py)
strain_animation = false
crack_tip_image = true
crack_tip_opening = true
make_video = true            #   video.mp4 whose playback time equals data.csv time_s
video_fps = 30.0
